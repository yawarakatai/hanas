[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hanas"
version = "0.1.0"
description = "Read selected text with an AivisSpeech or VOICEVOX voice"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
hanas = "hanas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
